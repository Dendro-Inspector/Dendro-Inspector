name: CI

# Runs on every push and pull request, including pull requests from forks.
#
# Fork PRs get no repository secrets and a read-only token, by GitHub's design. Every gate
# below is built to need neither: the whole suite runs against the deterministic fake
# provider, so an external contributor's PR is checked exactly as thoroughly as a
# maintainer's.
#
# Do NOT add `pull_request_target` here. It runs with a writable token, and combined with a
# checkout of untrusted PR code it hands repository write scope to a stranger's branch.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Belt and braces: even if a credential were present, the adapters would not be selected.
  DENDRO_PRIMARY_PROVIDER: fake
  DENDRO_ARBITER_PROVIDER: fake

jobs:
  quality:
    name: Lint, types and tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check .

      - name: Ruff lint
        run: ruff check --output-format=github .

      - name: Static type check
        run: mypy

      - name: Unit tests
        run: pytest tests/unit -q

      - name: Contract tests
        run: pytest tests/contract -q

      # Two copies of the domain prompt is a split brain waiting to happen: one gets
      # updated, the other does not, and the trace hash now attests to a stale file.
      - name: One canonical domain prompt
        run: pytest tests/contract/test_prompt_uniqueness.py -q

      - name: Integration tests (fake provider)
        run: pytest tests/integration -q

      - name: Evaluation tests
        run: pytest tests/evaluation -q

      - name: Public evaluation suite
        run: dendro eval --suite public --verbose

      - name: Graph renders
        run: dendro graph

      - name: Domain prompt loads and hashes
        run: dendro prompt-info

      - name: Upload evaluation report
        if: always() && matrix.python-version == '3.12'
        run: dendro eval --suite public --json --out eval-report.json || true

      - uses: actions/upload-artifact@v4
        if: always() && matrix.python-version == '3.12'
        with:
          name: eval-report
          path: eval-report.json
          if-no-files-found: ignore

  sdk-transport:
    name: SDK image transport (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install SDK extras
        run: pip install -e ".[dev,images,openai,anthropic]"
      - name: Verify real SDK requests against the local bridge handler
        run: pytest tests/integration/test_sdk_wire_transport.py -q

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A leaked credential in a public repository is public the instant it is pushed, and
      # deleting the commit does not unpublish it. This gate blocks rather than warns.
      #
      # We invoke the gitleaks binary directly rather than gitleaks/gitleaks-action@v2. The
      # action refuses to run for organization-owned repositories without a paid licence key
      # in a GITHUB_LICENSE secret; the CLI it wraps is MIT-licensed and unrestricted. Taking
      # the licence route would also break the no-secrets guarantee at the top of this file,
      # because fork PRs receive no secrets and the scan would fail for every outside
      # contributor. The binary needs no token at all.
      - name: Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          # Read-only, and only used for the fallback download below; fork PRs get one too.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          # The release download link sometimes fails (HTTP 504) while the API serves the same
          # asset, so fall back to the API. The digest check below covers either source.
          if ! curl -sSfL --retry 3 -o "$archive" \
              "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"; then
            echo "::warning::release download failed; fetching the asset through the API"
            asset_id="$(gh api "repos/gitleaks/gitleaks/releases/tags/v${GITLEAKS_VERSION}" \
              --jq ".assets[] | select(.name == \"${archive}\") | .id")"
            gh api -H "Accept: application/octet-stream" \
              "repos/gitleaks/gitleaks/releases/assets/${asset_id}" > "$archive"
          fi
          # A scanner fetched over the network is itself a supply-chain edge: pin the digest
          # so a swapped release asset fails the build instead of silently scanning nothing.
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" gitleaks
          # Exit 1 on findings, so a leak fails the job rather than being reported and passed.
          ./gitleaks git . --redact --verbose --exit-code 1

  build:
    name: Package builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
