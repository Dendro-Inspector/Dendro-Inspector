# General botanical knowledge reviewed against the domain prompt, the sources recorded
# here and the implementation. Rule-specific sources override the domain-prompt origin.
# AI-assisted review scope: docs/dataset-policy.md.
taxon_id: abies
display_name: Abies (fir)
native_resolution: genus
broader_identities:
  - resolution: family
    taxon_id: pinaceae
    display_name: Pinaceae (pine family)
    provenance:
      source: "Standard botanical taxonomy; the domain prompt names no family"
      source_type: inferred
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11
aliases:
  - fir
  - silver fir
  - abies
supported_resolution:
  - genus

# Needle attachment is the one character that settles Abies against Picea, and it is the
# reason both cards name the same feature path with different values: a fir needle leaves a
# flat, round scar on the twig, a spruce needle sits on a small woody peg. Declaring both
# lets the self-contradiction veto do real work — observing one value rules the other
# genus out instead of leaving two weak candidates to be argued over.
strong_positive_features:
  - feature: needles.attachment
    values:
      - single_on_disc_base
  - feature: cones.type
    values:
      - upright_disintegrating

supporting_features:
  - feature: bark.surface_marks
    values:
      - round_oval_scars
      - resin_blisters
  - feature: bark.texture
    values:
      - smooth_grey
      - fine_scales
  - feature: bark.flake_geometry
    values:
      - thin_irregular_edge_lifting
  - feature: needles.arrangement
    values:
      - flat_two_ranked
  - feature: crown.shape
    values:
      - conical

contradictions:
  - feature: needles.attachment
    values:
      - single_on_woody_peg
  - feature: needles.fascicles
    values:
      - two
      - three
      - five
  - feature: needles.persistence
    values:
      - deciduous
  - feature: needles.arrangement
    values:
      - clustered_on_short_shoots
    provenance:
      source: >-
        Gymnosperm Database, Abies (https://www.conifers.org/pi/Abies.php): "Leaves: Borne singly, persisting 5 or more years"; Larix (https://www.conifers.org/pi/Larix.php): "Leaves in tufts of 10-60 on short (spur) shoots". Accessed 2026-11-11.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11
  - feature: leaf.type
    values:
      - broadleaf_simple
      - compound_pinnate
    provenance:
      source: "General botanical knowledge (AI-assisted review, 2026-11-11)"
      source_type: inferred
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11

common_confusions:
  - picea
  - pinus

required_for_high_confidence:
  - needles_or_cones

follow_up_evidence:
  - needle_attachment_macro
  - cone_photo
  - twig_underside_macro

