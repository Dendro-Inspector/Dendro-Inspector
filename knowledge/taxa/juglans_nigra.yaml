# PLACEHOLDER demonstration content, not reviewed by a dendrologist. Like larix and abies,
# this taxon is NOT in the domain prompt: section 14 names only Juglans regia. It was added
# after a live upload photographed a planted walnut whose nuts and leaflets the pack could
# not represent (the model kept proposing `juglans` and `carya` as open-world hypotheses).
# Feature rules come from standard botanical descriptions of Juglans nigra, not from that
# upload's tokens; see each rule's provenance and docs/dataset-policy.md.
taxon_id: juglans_nigra
display_name: Juglans nigra (black walnut)
native_resolution: species
broader_identities:
  - resolution: genus
    taxon_id: juglans
    display_name: Juglans (walnut)
    provenance:
      source: "Domain prompt section 14 (BASE SPECIES)"
      source_type: domain_prompt
  - resolution: family
    taxon_id: juglandaceae
    display_name: Juglandaceae (walnut family)
    provenance:
      source: "Standard botanical taxonomy; the domain prompt names no family"
      source_type: inferred
aliases:
  - black walnut
  - eastern black walnut
  - juglans nigra
supported_resolution:
  - species

strong_positive_features:
  - feature: nut.shell_surface
    values:
      - deeply_corrugated_ridged
  - feature: fruit.husk
    values:
      - indehiscent_green_globose
  - feature: leaflet.count
    values:
      - fifteen_to_twenty_three

supporting_features:
  - feature: leaf.type
    values:
      - compound_pinnate
  - feature: leaflet.shape
    values:
      - lanceolate_finely_serrate_acuminate
  - feature: leaf.arrangement
    values:
      - alternate
  - feature: nut.shell_thickness
    values:
      - thick_hard
  - feature: nut.presence
    values:
      - present
  - feature: bark.pattern
    values:
      - diamond_fissures

# Ash (Fraxinus) shares the pinnate leaf and the diamond-fissured bark; its leaves are
# opposite. Juglans leaves are alternate, so an opposite arrangement read on this tree
# contradicts walnut.
contradictions:
  - feature: leaf.arrangement
    values:
      - opposite

common_confusions:
  - juglans_regia
  - fraxinus
  - robinia_pseudoacacia

required_for_high_confidence:
  - nut_or_leaf

follow_up_evidence:
  - nut_photo
  - leaf_attachment_photo
  - prepared_end_grain_macro

provenance:
  source: >-
    Standard botanical descriptions of Juglans nigra: pinnately compound alternate
    leaves of 15-23 lanceolate, finely serrate, acuminate leaflets; a globose fruit in a
    green indehiscent husk; a thick, hard, deeply corrugated nut; dark bark furrowed into
    diamond-patterned ridges (e.g. USDA Forest Service, Silvics of North America, vol. 2).
  source_type: literature
  region: Eastern Europe
  life_stage: any
  season: any
  confidence: low
  review_state: unreviewed
  reviewed_by: null
  last_reviewed: null

placeholder_content: true
