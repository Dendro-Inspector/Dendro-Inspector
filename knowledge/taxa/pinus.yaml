# General botanical knowledge reviewed against the domain prompt, the sources recorded
# here and the implementation. Rule-specific sources override the domain-prompt origin.
# AI-assisted review scope: docs/dataset-policy.md.
taxon_id: pinus
display_name: Pinus (pine)
native_resolution: genus
broader_identities:
  - resolution: family
    taxon_id: pinaceae
    display_name: Pinaceae (pine family)
    provenance:
      source: "Standard botanical taxonomy; the domain prompt names no family"
      source_type: inferred
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11
aliases:
  - pine
  - pinus
supported_resolution:
  - genus

strong_positive_features:
  - feature: needles.fascicles
    values:
      - two
      - three
      - five
  - feature: cones.scale_shape
    values:
      - woody_umbo
  # The trunk a person recognises as pine without looking up: thick plates built of thin
  # layers, orange-brown to reddish, flaking at the edges, dark fissures between. Maintainer
  # decision: this names the genus, at middle confidence and no higher (see the exception
  # below). Plainer plated bark stays supporting, because sycamore maple, horse chestnut and
  # old spruce also break into plates.
  - feature: bark.plate_build
    values:
      - layered_orange_brown
    note: >-
      Record when the layered build of the thick, separate plates is visible. Colour is
      not required: a younger pine is brighter, an older one darker (maintainer,
      2026-11-13), and shade greys both. Its own path, so that an ordinary bark.texture
      reading of the same trunk is never a contradiction of this one.
    provenance:
      source: >-
        Gymnosperm Database, Pinus sylvestris (https://www.conifers.org/pi/Pinus_sylvestris.php): "Bark on lower stem thick, scaly-plated, grey-brown; on upper stem and branches, thin, flaking, orange-red." Accessed 2026-11-13. Woodland Trust, Scots pine, cited below. Maintainer decision 2026-11-12 that this bark names the genus.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-12

supporting_features:
  - feature: bark.texture
    values:
      - scaly_plates
  # Old lower trunks: the plates are separated by long fissures. Supporting, and declared so
  # that this reading beside the layered plates is agreement, not a contradiction.
  - feature: bark.texture
    values:
      - deep_longitudinal_fissures
    life_stage: old
    provenance:
      source: >-
        Woodland Trust, Scots pine (https://www.woodlandtrust.org.uk/trees-woods-and-wildlife/british-trees/a-z-of-british-trees/scots-pine/): "The bark is a scaly orange-brown, which develops plates and fissures with age." Accessed 2026-11-12.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-12
  - feature: wood.tone
    values:
      - light_yellow_honey
  - feature: resin.presence
    values:
      - present
  - feature: trunk.form
    values:
      - straight_long
  # Scots pine's two-zone trunk. Supporting, not strong-positive: the lower trunk alone is
  # legitimately read as something else, and a strong positive would then veto the card.
  - feature: bark.pattern
    values:
      - orange_flaking_upper_plated_base
    note: >-
      Thin orange-red flaking bark on the upper stem above thick grey-brown scaly plates at
      the base. Characteristic of Pinus sylvestris; plated bark alone is not (Picea, Abies
      and Acer pseudoplatanus bark also forms plates).
    provenance:
      source: >-
        Gymnosperm Database, Pinus sylvestris (https://www.conifers.org/pi/Pinus_sylvestris.php, accessed 2026-11-11): "Bark on lower stem thick, scaly-plated, grey-brown; on upper stem and branches, thin, flaking, orange-red."
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11

  # The upper-stem bark of Scots pine, which is what most of a pine log pile shows. Supporting:
  # young Norway spruce bark is also "orange-brown, finely flaking" (Gymnosperm Database,
  # Picea abies), so it names nothing alone.
  - feature: bark.texture
    values:
      - thin_orange_flaking
    provenance:
      source: >-
        Gymnosperm Database, Pinus sylvestris (https://www.conifers.org/pi/Pinus_sylvestris.php): "Bark on lower stem thick, scaly-plated, grey-brown; on upper stem and branches, thin, flaking, orange-red." Verified 2026-11-12.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-12
  # The cut end: a reddish core inside a wide pale band. Spruce and fir have no coloured
  # heartwood; larch has one, inside a very narrow sapwood band. A thin young pine log may
  # show no heartwood yet, so its absence is not recorded as evidence against pine.
  - feature: heartwood.demarcation
    values:
      - reddish_core_wide_pale_sapwood
    note: >-
      A light reddish-brown core clearly set off from a wide pale yellow to whitish outer
      band on the cut end. Record only when both zones and the width of the pale band are
      visible.
    provenance:
      source: >-
        Wood Database, Scots pine (https://www.wood-database.com/scots-pine/): "Heartwood is light reddish brown, demarcated sapwood is pale yellow to nearly white."; CZU timber atlas (https://r.fld.czu.cz/vyzkum/multimedia/timber_atlas/nextpages/softwoods.html): "The sapwood is quite wide." Verified 2026-11-12.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-12
  # Annual rings readable by eye on a rough cut end. Every conifer and every ring-porous
  # broadleaf shows them, so this names nothing alone; it is the sign that the cut end of
  # the piece was in view at all, which the bark-and-log combination below needs.
  - feature: rings.visibility
    values:
      - clear
    note: >-
      Annual rings clearly readable by eye across the cut end, without preparation. Shared
      with spruce, fir, larch and ring-porous broadleaves.
    provenance:
      source: >-
        Maintainer decision, 2026-11-12: a pine log or piece of log is recognisable from its
        bark with the cut end in view. Reading recorded on live case photo-095 (sawn pine
        stump) as rings.visibility = clear. No literature quotation; not a separating feature
      source_type: expert_review
      region: Eastern Europe
      confidence: low
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-12

# Bark caps at low confidence by default. The domain prompt's own pine line is stronger than
# that ("If reddish bark, needles or typical coniferous log ends are visible: This is a
# pine"), and the maintainer set the level: the layered orange-brown plates answer pine at
# middle confidence. Genus only; needles or cones are still what high confidence needs.
confidence_exceptions:
  - requires:
      bark.plate_build: layered_orange_brown
    max_resolution: genus
    ceiling: medium
    note: >-
      Layered orange-brown plated bark names the pine genus at middle confidence. Larch is
      the look-alike on bark alone; needles or cones settle it.
    provenance:
      source: >-
        Maintainer decision, 2026-11-12 ("pine mid level"), after 5 of 5 standing pine
        trunks were read as pine by the model and left unnamed. Domain prompt, PINE: "If
        reddish bark, needles or typical coniferous log ends are visible". Confidence
        policy, not a feature rule
      source_type: expert_review
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-12

# A pine log has no needles and no cones, so neither strong positive above can ever be read
# from one. A forester names it anyway, from several log signs that agree, and checks the
# look-alikes with one specific sign each. The combinations below are those agreements; the
# contradictions further down are those checks (fir's resin blisters, larch's narrow sapwood).
#
# Permission to name the genus only. Confidence keeps the ceiling of the evidence seen, so
# bark with a chainsawn log end answers low and a prepared end grain can reach medium. Each
# reading alone stays supporting. When both are earned the first one is reported.
diagnostic_combinations:
  # The stronger one: pine bark with the pine cut end. The cut end is what separates pine
  # from spruce and fir (no coloured heartwood) and from larch (very narrow sapwood).
  - requires:
      bark.texture:
        - scaly_plates
        - thin_orange_flaking
      heartwood.demarcation: reddish_core_wide_pale_sapwood
    max_resolution: genus
    note: >-
      Bark and cut end agree; the wide pale sapwood sets it apart from spruce, fir and larch.
    provenance:
      source: >-
        Wood Database, Scots pine: "Heartwood is light reddish brown, demarcated sapwood is pale yellow to nearly white."; CZU timber atlas (https://r.fld.czu.cz/vyzkum/multimedia/timber_atlas/nextpages/softwoods.html): spruce heartwood "Absent"; larch "Sapwood very narrow, heartwood quite wide, compared to pine." Verified 2026-11-12. Naming policy, not a feature rule
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-12
  # The domain prompt's own log rule, with each of its three signs mapped to the token the
  # prompt gives: "reddish-brown or orange scaly bark", "resinous areas", "cross-section
  # light yellow or honey-coloured". Weaker than the one above and says so: spruce and larch
  # also carry resin, and tone is colour.
  - requires:
      bark.texture:
        - scaly_plates
        - thin_orange_flaking
      resin.presence: present
      wood.tone: light_yellow_honey
    max_resolution: genus
    note: >-
      Spruce and larch logs are not excluded; a reddish core in a wide pale band on the cut
      end would settle it.
    provenance:
      source: >-
        Domain prompt section 14 (PINE): "On a pile of logs you may go high if reddish bark,
        coniferous structure and typical log ends are all visible at once"; naming policy,
        not a feature rule
      source_type: domain_prompt
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-12
  # The weakest one, and the one a weathered or obliquely photographed log end can still
  # earn: pine bark on a piece whose cut end is in view. No heartwood boundary and no resin
  # is asked for, because a stump photographed in the yard often shows neither. The bark
  # does all the separating here (spruce bark is finely scaled, fir smooth, larch deeply
  # fissured); the rings only show that the cut end was read. Listed last so either
  # combination above is reported first when it is also earned.
  - requires:
      bark.texture:
        - scaly_plates
        - thin_orange_flaking
      rings.visibility: clear
    max_resolution: genus
    note: >-
      Named from the bark with the cut end in view. The wood excludes no conifer: larch and
      spruce are separated by bark only, and a reddish core in a wide pale band on a clean
      cut end would settle it.
    provenance:
      source: >-
        Maintainer decision, 2026-11-12: a pine log or piece of log is recognisable enough
        to name. Prompted by live case photo-095, a sawn pine stump on which three models
        read pine bark and abstained because neither combination above could be completed.
        Naming policy, not a feature rule
      source_type: expert_review
      region: Eastern Europe
      confidence: low
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-12

contradictions:
  - feature: needles.attachment
    values:
      - single_on_woody_peg
  - feature: leaf.type
    values:
      - broadleaf_simple
      - compound_pinnate
  # The separating characters of the three conifer confusions, each the confusion card's own
  # strong-positive token. Pine needles come in sheathed fascicles of a few, never in
  # spur-shoot tufts or singly on disc bases; pine cones do not disintegrate on the tree.
  - feature: needles.arrangement
    values:
      - clustered_on_short_shoots
    provenance:
      source: >-
        Gymnosperm Database, Pinus (https://www.conifers.org/pi/Pinus.php): needles in "fascicles of one to eight needles, initially bound together by a basal sheath"; Larix (https://www.conifers.org/pi/Larix.php): "Leaves in tufts of 10-60 on short (spur) shoots". Accessed 2026-11-11.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11
  - feature: needles.attachment
    values:
      - single_on_disc_base
    provenance:
      source: >-
        Gymnosperm Database, Pinus (https://www.conifers.org/pi/Pinus.php): needles in sheathed fascicles; Abies (https://www.conifers.org/pi/Abies.php): "Leaves: Borne singly", leaving "prominent leaf scars, circular to broadly elliptic". Accessed 2026-11-11.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11
  - feature: cones.type
    values:
      - upright_disintegrating
    provenance:
      source: >-
        Gymnosperm Database, Abies (https://www.conifers.org/pi/Abies.php): "Abies is unique among conifers in bearing erect cones that disarticulate in situ"; Pinus (https://www.conifers.org/pi/Pinus.php): "relatively stiff, woody scales". Accessed 2026-11-11.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11

  # The two checks a log allows. Bark-tier and wood-tier contradictions block the
  # combinations above; neither depends on needles or cones.
  - feature: bark.surface_marks
    values:
      - resin_blisters
    note: Resin blisters in smooth bark are fir; pine bark is plated or flaking.
    provenance:
      source: >-
        Gymnosperm Database, Abies alba (https://www.conifers.org/pi/Abies_alba.php): "Bark smooth, gray, scaly, with resin blisters."; Pinus sylvestris (https://www.conifers.org/pi/Pinus_sylvestris.php): bark "thick, scaly-plated" below and "thin, flaking" above. Verified 2026-11-12.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-12
  - feature: heartwood.demarcation
    values:
      - dark_core_very_narrow_sapwood
    note: A dark red-brown core reaching almost to the bark is larch; pine sapwood is wide.
    provenance:
      source: >-
        CZU timber atlas (https://r.fld.czu.cz/vyzkum/multimedia/timber_atlas/nextpages/softwoods.html): larch "Sapwood very narrow, heartwood quite wide, compared to pine."; Scotch pine "The sapwood is quite wide." Verified 2026-11-12.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-12

common_confusions:
  - abies
  - larix
  - picea

required_for_high_confidence:
  - needles_or_cones

follow_up_evidence:
  - needle_fascicle_macro
  - cone_photo
  - prepared_end_grain_macro

provenance:
  source: "Domain prompt section 14 (BASE SPECIES)"
  source_type: domain_prompt
  region: Eastern Europe
  life_stage: any
  season: any
  confidence: medium
