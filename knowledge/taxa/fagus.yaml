taxon_id: fagus
display_name: Fagus (beech)
native_resolution: genus
broader_identities:
  - resolution: family
    taxon_id: fagaceae
    display_name: Fagaceae (beech family)
    provenance:
      source: "Standard botanical taxonomy; the domain prompt names no family"
      source_type: inferred
      confidence: medium
