      source_type: inferred
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11
  - feature: leaf.shape
    values:
      - oval_serrate_strong_veins
    note: >-
      Sharply serrate leaves with strong parallel veins are hornbeam; beech leaves are entire or wavy.
    provenance:
      source: "General botanical knowledge (AI-assisted review, 2026-11-11)"
      source_type: inferred
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11
  - feature: trunk.form
    values:
      - fluted_muscular
    note: >-
      A fluted, muscular trunk is hornbeam; beech trunks are smooth and cylindrical.
    provenance:
      source: "General botanical knowledge (AI-assisted review, 2026-11-11)"
      source_type: inferred
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11

