strong_positive_features:
  # Smooth bark is beech's own reading: scaly or fissured bark rules beech out.
  - feature: bark.texture
    values:
      - smooth_grey
  - feature: leaf.shape
    values:
      - oval_entire_wavy_margin
  - feature: fruit.type
    values:
      - triangular_nuts_in_spiny_husk
    note: >-
      Three-angled beechnuts in a woody, four-valved spiny husk.
    provenance:
      source: "General botanical knowledge (AI-assisted review, 2026-11-11)"
      source_type: inferred
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11
  - feature: bud.shape
    values:
      - long_slender_pointed
    note: >-
      Long, slender, cigar-shaped pointed winter buds.
    provenance:
      source: "General botanical knowledge (AI-assisted review, 2026-11-11)"
      source_type: inferred
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11

supporting_features:
  - feature: trunk.form
    values:
      - straight_cylindrical
  - feature: wood.tone
    values:
      - cream_pinkish
  - feature: pores.arrangement
    values:
      - diffuse_porous

contradictions:
  - feature: pores.arrangement
    values:
      - ring_porous
  - feature: leaf.arrangement
    values:
      - opposite
    provenance:
