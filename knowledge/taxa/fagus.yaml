    values:
      - ring_porous

common_confusions:
  - carpinus

required_for_high_confidence:
  - leaf_or_trunk.form

follow_up_evidence:
  - leaf_upper_macro
  - trunk_full_height_photo
  - prepared_end_grain_macro

provenance:
  source: "Domain prompt section 14 (БАЗОВІ ПОРОДИ)"
  source_type: domain_prompt
  region: Eastern Europe
  life_stage: any
  season: any
  confidence: low
  review_state: unreviewed
  reviewed_by: null
