    values:
      - smooth_grey
  - feature: leaf.shape
    values:
      - oval_entire_wavy_margin

supporting_features:
  - feature: trunk.form
    values:
      - straight_cylindrical
  - feature: wood.tone
    values:
      - cream_pinkish
  - feature: pores.arrangement
    values:
      - diffuse_porous

contradictions:
