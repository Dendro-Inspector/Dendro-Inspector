# PLACEHOLDER demonstration content — feature rules derived from section 14 of the
# domain prompt, not reviewed by a dendrologist. Any rule or identity carrying its own
# provenance block names a different source. See docs/dataset-policy.md.
taxon_id: betula
display_name: Betula (береза)
native_resolution: genus
broader_identities:
  - resolution: family
    taxon_id: betulaceae
    display_name: Betulaceae (березові)
    provenance:
      source: "Standard botanical taxonomy; the domain prompt names no family"
      source_type: inferred
aliases:
  - береза
  - birch
  - betula
supported_resolution:
  - genus

strong_positive_features:
  - feature: bark.pattern
    values:
      - white_papery_with_black_marks

supporting_features:
  - feature: bark.peeling
    values:
      - thin_layers
  - feature: lenticels.orientation
    values:
      - horizontal
  - feature: leaf.shape
    values:
      - small_triangular_serrate

# White papery bark with black marks is the one bark signature in this pack strong enough
# to lift the bark confidence ceiling by a single band at genus level. RHS and Trees and
# Shrubs Online both treat it as diagnostic for Betula, and the domain prompt's section 14
# says the same. It does not license a species claim, and the dark, coarsely fissured base
# of a mature trunk is normal for B. pendula rather than evidence against birch.
diagnostic_bark_features:
  - feature: bark.pattern
    values:
      - white_papery_with_black_marks

contradictions: []

common_confusions:
  - populus_alba

required_for_high_confidence:
  - bark.pattern_or_leaf

follow_up_evidence:
  - bark_macro_mid_trunk
  - leaf_upper_macro
  - twig_photo

provenance:
  source: "Domain prompt section 14 (БАЗОВІ ПОРОДИ)"
  source_type: domain_prompt
  region: Eastern Europe
  life_stage: any
  season: any
  confidence: low
  review_state: unreviewed
  reviewed_by: null
  last_reviewed: null

placeholder_content: true
