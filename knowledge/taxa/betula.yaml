# PLACEHOLDER demonstration content — feature rules derived from section 14 of the
# domain prompt, not reviewed by a dendrologist. Any rule or identity carrying its own
# provenance block names a different source. See docs/dataset-policy.md.
taxon_id: betula
display_name: Betula (береза)
native_resolution: genus
broader_identities:
  - resolution: family
    taxon_id: betulaceae
    display_name: Betulaceae (березові)
    provenance:
      source: "Standard botanical taxonomy; the domain prompt names no family"
      source_type: inferred
aliases:
  - береза
  - birch
  - betula
supported_resolution:
  - genus

strong_positive_features:
  - feature: bark.pattern
    values:
      - white_papery_with_black_marks

supporting_features:
  - feature: bark.peeling
    values:
      - thin_layers
  - feature: lenticels.orientation
    values:
      - horizontal
  - feature: leaf.shape
    values:
      - small_triangular_serrate

# White papery bark with black marks is the one bark signature in this pack the domain
# prompt itself places at the top of the scale: section 6 lists it among the 95-100
# examples, and section 14 says the genus may be called very high from it. RHS and Trees
# and Shrubs Online both treat it as diagnostic for Betula.
#
# Genus and no further. The prompt's own next line asks for leaves and thin twigs before a
# species, and line 457 says not to shout "birch 96" at pale trunks seen from a distance —
# which the trust gate, not this exception, is what enforces. The dark coarsely fissured
# base of a mature trunk is normal for B. pendula rather than evidence against birch.
confidence_exceptions:
  - requires:
      bark.pattern: white_papery_with_black_marks
    max_resolution: genus
    ceiling: very_high
    note: >-
      Section 6 lists characteristic white papery bark with black marks among its 95-100
      examples; section 14 permits very high confidence at Betula genus level.
    provenance:
      source: "Domain prompt sections 6 and 14; confidence policy, not a feature rule"
      source_type: domain_prompt
      region: Eastern Europe
      confidence: medium
      review_state: unreviewed

contradictions: []

common_confusions:
  - populus_alba

required_for_high_confidence:
  - bark.pattern_or_leaf

follow_up_evidence:
  - bark_macro_mid_trunk
  - leaf_upper_macro
  - twig_photo

provenance:
  source: "Domain prompt section 14 (БАЗОВІ ПОРОДИ)"
  source_type: domain_prompt
  region: Eastern Europe
  life_stage: any
  season: any
  confidence: low
  review_state: unreviewed
  reviewed_by: null
  last_reviewed: null

placeholder_content: true
