# General botanical knowledge reviewed against the domain prompt, the sources recorded
# here and the implementation. Rule-specific sources override the domain-prompt origin.
# AI-assisted review scope: docs/dataset-policy.md.
taxon_id: picea
display_name: Picea (spruce)
native_resolution: genus
broader_identities:
  - resolution: family
    taxon_id: pinaceae
    display_name: Pinaceae (pine family)
    provenance:
      source: "Standard botanical taxonomy; the domain prompt names no family"
      source_type: inferred
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11
aliases:
  - spruce
  - picea
supported_resolution:
  - genus

strong_positive_features:
  - feature: needles.attachment
    values:
      - single_on_woody_peg
  - feature: cones.type
    values:
      - pendent_thin_scaled
    note: >-
      Hanging cones with thin, flexible scales, shed whole; fir cones stand upright and pine cones have woody umbos.
    provenance:
      source: "General botanical knowledge (AI-assisted review, 2026-11-11)"
      source_type: inferred
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11

supporting_features:
  - feature: crown.shape
    values:
      - conical
  - feature: bark.texture
    values:
      - fine_scales
  - feature: wood.tone
    values:
      - light
  # The spruce cut end: resin canals, and no coloured heartwood. Canals are faint in spruce
  # and count only from a prepared end grain.
  - feature: wood.resin_canals
    values:
      - present
    provenance:
      source: >-
        CZU timber atlas, spruce (https://r.fld.czu.cz/vyzkum/multimedia/timber_atlas/nextpages/softwoods.html): "Resin canals: Present". Verified 2026-11-12.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-12
  - feature: heartwood.demarcation
    values:
      - none_uniform_pale
    note: >-
      The cut end is one pale colour from pith to bark, with no darker core. Record only on
      a log thick enough that a core would show.
    provenance:
      source: >-
        CZU timber atlas, spruce (https://r.fld.czu.cz/vyzkum/multimedia/timber_atlas/nextpages/softwoods.html): "Heartwood: Absent". Verified 2026-11-12.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-12

# A spruce log: finely scaled bark, resin canals in the wood and no coloured core. The
# canals separate it from fir and the missing core from larch and from pine of any size.
diagnostic_combinations:
  - requires:
      bark.texture: fine_scales
      wood.resin_canals: present
      heartwood.demarcation: none_uniform_pale
    max_resolution: genus
    note: >-
      A thin young pine log without heartwood is not excluded by the wood; the finely
      scaled bark is what points to spruce.
    provenance:
      source: >-
        CZU timber atlas (https://r.fld.czu.cz/vyzkum/multimedia/timber_atlas/nextpages/softwoods.html): spruce "Resin canals: Present", "Heartwood: Absent"; "Absence of the resin canals is one of the most important features to distinguish fir from spruce." Verified 2026-11-12. Naming policy, not a feature rule
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-12

contradictions:
  # A prepared end grain with no resin canals is fir, not spruce.
  - feature: wood.resin_canals
    values:
      - none_in_end_grain
    provenance:
      source: >-
        CZU timber atlas (https://r.fld.czu.cz/vyzkum/multimedia/timber_atlas/nextpages/softwoods.html): "Absence of the resin canals is one of the most important features to distinguish fir from spruce." Verified 2026-11-12.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-12
  - feature: needles.fascicles
    values:
      - two
      - three
      - five
  - feature: needles.persistence
    values:
      - deciduous
  # Fir and larch's separating characters, as on the pine card.
  - feature: needles.attachment
    values:
      - single_on_disc_base
    provenance:
      source: >-
        Gymnosperm Database, Picea (https://www.conifers.org/pi/Picea.php): leaves "sessile on peglike base (called a sterigma)"; Abies (https://www.conifers.org/pi/Abies.php): leaf scars "circular to broadly elliptic, flush with twig surface". Accessed 2026-11-11.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11
  - feature: cones.type
    values:
      - upright_disintegrating
    provenance:
      source: >-
        Gymnosperm Database, Picea (https://www.conifers.org/pi/Picea.php): seed cones "pendent, ovoid to cylindric"; Abies (https://www.conifers.org/pi/Abies.php): cones "erect ... dehiscent (falling apart on maturity)". Accessed 2026-11-11.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11
  - feature: needles.arrangement
    values:
      - clustered_on_short_shoots
    provenance:
      source: >-
        Gymnosperm Database, Picea (https://www.conifers.org/pi/Picea.php): "Leaves borne singly, spreading radially from twigs"; Larix (https://www.conifers.org/pi/Larix.php): "Leaves in tufts of 10-60 on short (spur) shoots". Accessed 2026-11-11.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11
  - feature: leaf.type
    values:
      - broadleaf_simple
      - compound_pinnate
    provenance:
      source: "General botanical knowledge (AI-assisted review, 2026-11-11)"
      source_type: inferred
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11

