# General botanical knowledge reviewed against the source descriptions recorded here
# and the implementation, using no new external retrieval. Rule-specific sources override
# the domain-prompt origin. AI-assisted review scope: docs/dataset-policy.md.
#
# Look-alike with no card: Acer negundo (box elder) also has opposite pinnate leaves, but
# with 3-5(7) coarsely toothed or lobed leaflets and paired samaras. The Acer card does not
# describe it yet.
taxon_id: fraxinus
display_name: Fraxinus (ash)
native_resolution: genus
broader_identities:
  - resolution: family
    taxon_id: oleaceae
    display_name: Oleaceae (olive family)
    provenance:
      source: "Standard botanical taxonomy; the domain prompt names no family"
      source_type: inferred
      confidence: medium
      review_state: reviewed
      reviewed_by: "Codex (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11
aliases:
  - ash
  - fraxinus
supported_resolution:
  - genus

strong_positive_features:
  - feature: samara.shape
    values:
      - single_wing_paddle
    provenance:
      source: >-
        Virginia Tech Dendrology, European ash (https://dendro.cnre.vt.edu/dendrology/syllabus/factsheet.cfm?ID=969): "Straight, single winged samara, 1 to 1 1/2 inches long, 1/2 inch wide, in hanging clusters". Accessed 2026-11-11.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Codex (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11
  # The leaf character that separates ash from box elder, so a male ash (no samaras) can
  # still be named from an attached leaf. Opposite and pinnate alone stay supporting.
  - feature: leaflet.shape
    values:
      - ovate_lanceolate_serrate
    note: >-
      Seven or more narrowly ovate to lanceolate leaflets with fine, regular teeth. Few
      (3-5) coarsely toothed or lobed leaflets are box elder: record coarse_serrate_or_lobed.
    provenance:
      source: >-
        Virginia Tech Dendrology (https://dendro.cnre.vt.edu/dendrology/syllabus/factsheet.cfm?ID=969): "9 to 11 narrowly ovate, finely serrated leaflets"; USU TreeBrowser (https://extension.usu.edu/treebrowser/catalog/ash-european): "7 to 11 leaflets", "margins serrate". Accessed 2026-11-11.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11

supporting_features:
  # Compatible with ash, not diagnostic: Acer negundo also has opposite pinnate leaves.
  - feature: leaf.arrangement
    values:
      - opposite
    provenance:
      source: >-
        Utah State University TreeBrowser, European ash (https://extension.usu.edu/treebrowser/catalog/ash-european): "Opposite; once pinnately compound; 10" to 12" long; 7 to 11 leaflets". Accessed 2026-11-11.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Codex (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11
  # Black buds are Fraxinus excelsior's; F. pennsylvanica's are brown, so their absence
  # says nothing against ash. Colour retains the policy's bark-equivalent ceiling.
  - feature: bud.colour
    values:
      - black_velvety
    provenance:
      source: >-
        Utah State University TreeBrowser (https://extension.usu.edu/treebrowser/catalog/ash-european): "Buds black, pubescent, covered with 4-6 scales."; Virginia Tech: "buds pubescent, very dark (essentially black)". Accessed 2026-11-11.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Codex (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11
  # Robinia and walnut share the pinnate leaf; it supports ash, it does not decide it.
  - feature: leaf.type
    values:
      - compound_pinnate
  - feature: bark.pattern
    values:
      - diamond_fissures
    provenance:
      source: >-
        Virginia Tech Dendrology (https://dendro.cnre.vt.edu/dendrology/syllabus/factsheet.cfm?ID=969): "Initially smooth light gray brown, later become ridged and furrowed forming a tight diamond shaped pattern." Accessed 2026-11-11.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Codex (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11
  - feature: pores.arrangement
    values:
      - ring_porous
  - feature: wood.tone
    values:
      - pale

contradictions:
  - feature: leaf.arrangement
    values:
      - alternate
  # Maple: opposite as well, but a simple palmate leaf and paired samaras.
  - feature: leaf.type
    values:
      - broadleaf_simple
  - feature: leaf.shape
    values:
      - palmate_lobed
  - feature: samara.presence
    values:
      - paired
  # Box elder (Acer negundo): opposite pinnate as well, but few coarse or lobed leaflets.
  - feature: leaflet.shape
    values:
      - coarse_serrate_or_lobed
    provenance:
      source: >-
        Virginia Tech Dendrology, boxelder (https://dendro.cnre.vt.edu/dendrology/syllabus/factsheet.cfm?ID=3): "3 to 5 leaflets (sometimes 7)"; "margin coarsely serrate or somewhat lobed". Accessed 2026-11-11.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11
  # Robinia's entire, mucronate leaflet; ash leaflets are serrate.
  - feature: leaflet.shape
    values:
      - oval_entire_mucronate
    provenance:
      source: >-
        USU TreeBrowser (https://extension.usu.edu/treebrowser/catalog/ash-european): ash leaflet "margins serrate". Accessed 2026-11-11.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Codex (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11

common_confusions:
  - juglans_nigra
  - juglans_regia
  - quercus
  - robinia_pseudoacacia

required_for_high_confidence:
  - samara.shape_or_leaflet.shape_and_leaf.arrangement

follow_up_evidence:
  - leaf_attachment_photo
  - leaf_upper_macro
  - samara_photo
  - winter_twig_photo
  - prepared_end_grain_macro

provenance:
  source: "Domain prompt section 14 (BASE SPECIES)"
  source_type: domain_prompt
  region: Eastern Europe
  life_stage: any
  season: any
  confidence: medium
  review_state: reviewed
  reviewed_by: "Codex (AI-assisted botanical and implementation review)"
  last_reviewed: 2026-11-11

