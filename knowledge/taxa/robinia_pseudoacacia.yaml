# General botanical knowledge reviewed against the source descriptions recorded here
# and the implementation, using no new external retrieval. Rule-specific sources override
# the domain-prompt origin. AI-assisted review scope: docs/dataset-policy.md.
#
# Look-alikes in Eastern European plantings that have no card yet, so they cannot be named
# as confusions: Gleditsia triacanthos (branched trunk thorns, pinnate and bipinnate
# leaves, long twisted pods), Styphnolobium japonicum (acute leaflets, pods constricted
# between seeds, no spines) and Ailanthus altissima (large leaflets with basal glandular
# teeth, samaras).
taxon_id: robinia_pseudoacacia
display_name: Robinia pseudoacacia (black locust)
native_resolution: species
broader_identities:
  - resolution: genus
    taxon_id: robinia
    display_name: Robinia (locust)
    provenance:
      source: "Domain prompt section 14 (BASE SPECIES)"
      source_type: domain_prompt
      confidence: medium
      review_state: reviewed
      reviewed_by: "Codex (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11
  - resolution: family
    taxon_id: fabaceae
    display_name: Fabaceae (legume family)
    provenance:
      source: "Standard botanical taxonomy; the domain prompt names no family"
      source_type: inferred
      confidence: medium
      review_state: reviewed
      reviewed_by: "Codex (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11
# "locust" alone is not an alias: it also names honey locust (Gleditsia).
aliases:
  - black locust
  - robinia
  - false acacia
  - robinia pseudoacacia
supported_resolution:
  - species

strong_positive_features:
  # This combined reading requires all four details, including a resolved length. The
  # generic shape below remains supporting when size or surface cannot be read.
  - feature: pod.shape
    values:
      - flat_oblong_smooth_3_to_8_cm
    note: >-
      Record only a flat, oblong, smooth pod whose length is resolved as 3-8 cm against
      a scale. Without a resolved length or surface, use flat_oblong_legume instead.
    provenance:
      source: >-
        VicFlora, Robinia pseudoacacia (https://vicflora.rbg.vic.gov.au/flora/taxon/f219cee9-4fe3-4883-893e-f612a529339f): "Pod 3–8 cm long, 10–15 mm wide, pendulous, glabrous"; Flora of New Zealand (https://nzflora.info/factsheet/Taxon/Robinia-pseudoacacia.html): "Pod glabrous, irregularly oblong, 2–8-seeded, 35–80 mm long". Accessed 2026-11-11.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Codex (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11
  # Spines in pairs at the leaf nodes (modified stipules), not branched thorns on the trunk.
  - feature: branch.thorns
    values:
      - paired_stipular_spines
    provenance:
      source: >-
        Flora of New Zealand (https://nzflora.info/factsheet/Taxon/Robinia-pseudoacacia.html): "usually with stout scattered stipular spines up to c. 1 cm long"; VicFlora: "stipules becoming spiny, 5–25 mm long". Accessed 2026-11-11.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Codex (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11

supporting_features:
  - feature: pod.shape
    values:
      - flat_oblong_legume
    note: Shape without the resolved size and surface does not distinguish this species.
    provenance:
      source: >-
        The pod morphology recorded from VicFlora, Robinia pseudoacacia, and Flora of New
        Zealand, Robinia pseudoacacia, in the detailed pod rule above; size and surface
        remain unresolved in this reading.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Codex (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11
  - feature: pod.presence
    values:
      - present
  # Thorns read without their arrangement; only paired node spines are strong.
  - feature: branch.thorns
    values:
      - present
  # Ash and walnut share a pinnate leaf; the entire, blunt-to-notched mucronate leaflet and
  # the alternate arrangement are what point to Robinia.
  - feature: leaf.type
    values:
      - compound_pinnate
      - compound_pinnate_rounded_leaflets
  - feature: leaf.arrangement
    values:
      - alternate
  - feature: leaflet.shape
    values:
      - oval_entire_mucronate
    provenance:
      source: >-
        VicFlora (https://vicflora.rbg.vic.gov.au/flora/taxon/f219cee9-4fe3-4883-893e-f612a529339f): "leaflets 11–21, oblong to obovate, 1.5–5 cm long, 1–2.5 cm wide, obtuse to emarginate, mucronate"; "margins entire". Accessed 2026-11-11.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Codex (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11
  # Deferred: Flora of New Zealand describes white corollas in racemes, and VicFlora
  # describes many fragrant flowers (sources above). Flowers currently have no evidence
  # tier or attachment contract, so no executable flower rule or requirement is declared.
  # Supporting, not strong: old ash and black walnut bark also forms deep interlacing ridges,
  # and one patch of bark never decides a taxon.
  - feature: bark.texture
    values:
      - deep_rope_like_furrows
    provenance:
      source: >-
        Go Botany, Robinia pseudoacacia (https://gobotany.nativeplanttrust.org/species/robinia/pseudoacacia): "The ropy brown bark and red spines that line the new shoots also distinguish this locust from its relatives." Accessed 2026-11-11.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Codex (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11
  - feature: heartwood.tone
    values:
      - greenish_gold
  - feature: bark.surface_marks
    values:
      - orange_red_tint_in_furrows
    life_stage: mature
    provenance:
      source: >-
        https://en.wikipedia.org/wiki/Robinia_pseudoacacia: "The bark is a reddish black and gray and tinged with red or orange in the grooves" Accessed 2026-11-11 (KNOWLEDGE-RESEARCH-2026-11-11).
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Claude (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11

contradictions:
  # Ash: opposite leaves.
  - feature: leaf.arrangement
    values:
      - opposite
  - feature: leaf.type
    values:
      - broadleaf_simple
      - bipinnate
    provenance:
      source: >-
        Go Botany (https://gobotany.nativeplanttrust.org/species/robinia/pseudoacacia): "the leaf is compound, with a single terminal leaflet and more than two additional leaflets". Robinia leaves are once pinnate; a simple or twice-pinnate leaf (Gleditsia) is not Robinia. Accessed 2026-11-11.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Codex (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11
  # Toothed leaflets (black walnut's own token) contradict Robinia's entire margins.
  - feature: leaflet.shape
    values:
      - lanceolate_finely_serrate_acuminate
    provenance:
      source: >-
        VicFlora (https://vicflora.rbg.vic.gov.au/flora/taxon/f219cee9-4fe3-4883-893e-f612a529339f): leaflet "margins entire". Accessed 2026-11-11.
      source_type: literature
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Codex (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11
  # Gleditsia's branched thorns grow from the trunk and branches, not in pairs at the nodes.
  - feature: branch.thorns
    values:
      - branched_trunk_thorns
    provenance:
      source: >-
        Flora of New Zealand (https://nzflora.info/factsheet/Taxon/Robinia-pseudoacacia.html): Robinia's spines are "stipular spines up to c. 1 cm long", so large branched thorns on the trunk belong to another taxon. Accessed 2026-11-11.
      source_type: inferred
      region: Eastern Europe
      confidence: medium
      review_state: reviewed
      reviewed_by: "Codex (AI-assisted botanical and implementation review)"
      last_reviewed: 2026-11-11

common_confusions:
