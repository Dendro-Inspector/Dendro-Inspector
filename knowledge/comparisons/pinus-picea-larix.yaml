comparison_id: pinus-picea-larix
taxa:
  - pinus
  - picea
  - larix

shared_features:
  - bark.flake_geometry
  - bark.texture
  - wood.resin_canals
  - trunk.form

decisive_differences:
  - feature: needles.attachment
    photo: needle_attachment_macro
    separates:
      - pinus
      - picea
      - larix
    note: Fascicled and sheathed (Pinus) vs single on a woody peg (Picea) vs clustered on short shoots (Larix).
  - feature: needles.fascicles
    photo: needle_fascicle_macro
    separates:
      - pinus
      - picea
    favours: pinus
    note: A counted fascicle of 2, 3 or 5 rules out Picea outright.
  - feature: needles.persistence
    separates:
      - larix
      - pinus
      - picea
    favours: larix
    note: Deciduous separates Larix from both evergreen genera.

