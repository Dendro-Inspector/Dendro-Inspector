comparison_id: prunus-group
taxa:
  - prunus
  - prunus_cerasifera
  - prunus_avium
  - prunus_armeniaca

shared_features:
  - lenticels.orientation
  - heartwood.tone
  - context.site
  - leaf.shape

decisive_differences:
  - feature: fruit.type
    separates:
      - prunus_cerasifera
      - prunus_avium
      - prunus_armeniaca
    note: Without the fruit, cherry plum, plum and blackthorn are near twins.
  - feature: bark.pattern
    separates:
      - prunus_avium
      - prunus_cerasifera
    note: Prunus avium shows banded, strongly lenticelled bark peeling in plates.

insufficient_features:
  - heartwood.tone
  - wood.colour
  - bark.texture
  - context.site

recommended_follow_up_photos:
