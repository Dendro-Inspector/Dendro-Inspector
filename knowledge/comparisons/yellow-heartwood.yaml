comparison_id: yellow-heartwood
taxa:
  - robinia_pseudoacacia
  - morus
  - prunus
  - prunus_cerasifera

shared_features:
  - heartwood.tone
  - wood.tone

decisive_differences:
  - feature: bark.texture
    photo: bark_macro_mid_trunk
    separates:
      - robinia_pseudoacacia
      - morus
    note: Robinia's deep rope-like furrows are unlike mulberry's coarser, blockier bark.
  - feature: pod.presence
    photo: fruit_photo
    separates:
      - robinia_pseudoacacia
      - morus
      - prunus
    favours: robinia_pseudoacacia
    note: Pods settle Robinia.
  - feature: lenticels.orientation
    photo: bark_macro_mid_trunk
    separates:
      - prunus
      - prunus_cerasifera
      - robinia_pseudoacacia
    note: Horizontal lenticels point to the Prunus group.

