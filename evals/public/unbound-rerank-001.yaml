case_id: unbound-rerank-001
title: Rejected rerank recommendation cannot change the primary ranking
description: >-
  Both initial candidates have exact bark support. A reviewer recommends Picea first using
  evidence that does not match Picea, so validation removes the proposed taxon and rejects the
  rerank finding. The raw recommendation must remain inert.
scenario: unbound-rerank

input:
  case_id: unbound-rerank-001
  images:
    - image_id: img-1
      path: examples/unbound-rerank-001.jpg
      media_type: image/jpeg
  user_text: Which conifer is this bark from?
  location: Kyiv Oblast, Ukraine
  season: winter
  declared_object_type: bark

# v0.10 policy (require_discriminating_support, on by default): this fixture's leader is
# admitted only on features its card lists as supporting, so it stays a candidate but is
# not named. Expected resolution moved from genus to unknown on purpose; every other
# assertion — the mechanism this case exists for — is unchanged.
# See docs/reviews/EVIDENCE-COVERAGE-2026-11-11.md.
expect:
  expected_candidate_taxa:
    - pinus
    - picea
  expected_resolution: unknown
  max_resolution: genus
  max_confidence: low
  expected_evidence_tier: 3
  require_escalation: true
  expected_rejected_finding_id: model-rejected-rerank
  forbid_admitted_reranks: true
  max_retries: 0

