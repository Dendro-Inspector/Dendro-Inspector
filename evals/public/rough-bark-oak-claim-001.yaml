# See docs/reviews/EVIDENCE-COVERAGE-2026-11-11.md.
expect:
  expected_resolution: unknown
  max_resolution: genus
  max_confidence: low
  expected_evidence_tier: 3
  expected_user_claim_verdict: possible
  forbid_user_claim_rejection: true
