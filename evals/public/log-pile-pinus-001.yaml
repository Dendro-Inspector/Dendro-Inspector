case_id: log-pile-pinus-001
title: Corroborated log pile remains eligible for Pinus
description: >-
  A material-group subject carries repeated scaly bark, light honey wood and visible resin.
  The pile-level result must remain candidate-bearing while confidence stays conservative.
scenario: log-pile-pinus

input:
  case_id: log-pile-pinus-001
  images:
    - image_id: img-1
      path: examples/log-pile-pinus-001.jpg
      media_type: image/jpeg
  user_text: Are these pine logs?
  location: Kyiv Oblast, Ukraine
  declared_object_type: log

# The leader matches no single feature its card calls diagnostic: a log has no needles and
# no cones. It is named because the Pinus card declares scaly bark, resin and honey-coloured
# wood a diagnostic combination (domain prompt section 14, "On a pile of logs..."), which
# permits the genus and leaves the bark-tier confidence ceiling in place. Under v0.10 this
# case expected `unknown`; the specification says a pine log pile may be named.
expect:
  expected_candidate_taxa:
    - pinus
  expected_resolution: genus
  max_resolution: genus
  max_confidence: low
  expected_evidence_tier: 3
  require_next_photo: true
  require_escalation: false
  max_retries: 0

placeholder_content: true
