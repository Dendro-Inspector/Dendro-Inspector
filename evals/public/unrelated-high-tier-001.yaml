case_id: unrelated-high-tier-001
title: Unrelated high-tier evidence cannot raise a bark-supported candidate
description: >-
  An attached apple-like fruit is high-tier evidence for some taxa, but it does not match the
  Pinus card. Only the exact bark feature may support Pinus, so its tier and confidence remain
  in the bark band.
scenario: unrelated-high-tier

input:
  case_id: unrelated-high-tier-001
  images:
    - image_id: img-1
      path: examples/unrelated-high-tier-001.jpg
      media_type: image/jpeg
  user_text: The bark looks like pine, but there is fruit in the frame.
  location: Kyiv Oblast, Ukraine
  season: autumn
  declared_object_type: standing_tree

# v0.10 policy (require_discriminating_support, on by default): this fixture's leader is
# admitted only on features its card lists as supporting, so it stays a candidate but is
# not named. Expected resolution moved from genus to unknown on purpose; every other
# assertion — the mechanism this case exists for — is unchanged.
# See docs/reviews/EVIDENCE-COVERAGE-2026-11-11.md.
expect:
  expected_candidate_taxa:
    - pinus
  expected_resolution: unknown
  max_resolution: genus
  max_confidence: low
  expected_evidence_tier: 3
  require_escalation: false
  forbid_admitted_reranks: true
  max_retries: 0

